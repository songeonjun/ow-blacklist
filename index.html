<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블랙리스트 조회</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: #15171c; color: #e8e9ec;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8b8f99; font-size: 13px; margin: 0 0 24px; }
  input {
    width: 100%; padding: 14px 16px; font-size: 17px;
    border-radius: 12px; border: 1px solid #2c3039;
    background: #1d2027; color: #fff; outline: none;
  }
  input:focus { border-color: #f99e1a; }
  .result {
    margin-top: 16px; padding: 18px; border-radius: 12px;
    font-size: 16px; line-height: 1.5; display: none;
  }
  .result.hit  { display: block; background: #3a1619; border: 1px solid #c8333d; }
  .result.miss { display: block; background: #15301f; border: 1px solid #2f9e57; }
  .result.near { display: block; background: #2e2715; border: 1px solid #b8892a; }
  .big { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 8px;
    font-size: 14px; cursor: pointer;
  }
  .add { margin-top: 32px; padding-top: 20px; border-top: 1px solid #2c3039; }
  .add h2 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; }
  .row input { font-size: 15px; padding: 12px 14px; }
  button {
    padding: 0 18px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600;
    background: #f99e1a; color: #15171c; cursor: pointer; white-space: nowrap;
  }
  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .tag.mine { border: 1px solid #f99e1a55; }
  .tag .x { margin-left: 6px; color: #e07070; cursor: pointer; }
  .meta { font-size: 13px; color: #c9a0a0; margin-top: 6px; }
  .row2 { display: flex; gap: 8px; margin-bottom: 8px; }
  .row2 input { font-size: 15px; padding: 12px 14px; }
  .row2 input#addBy { max-width: 140px; }
  .list { margin-top: 8px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
          background: rgba(255,255,255,0.05); margin-bottom: 6px; font-size: 14px; color: #c9ccd3; }
  .item .n { flex: 1; cursor: pointer; }
  .item .m { font-size: 12px; color: #8b8f99; white-space: nowrap; }
  .item .x { color: #e07070; cursor: pointer; padding: 0 4px; }
  .mapbox { position: relative; }
  .maplist { display: none; position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 5;
             background: #1d2027; border: 1px solid #2c3039; border-radius: 12px; max-height: 260px; overflow-y: auto; }
  .maplist.open { display: block; }
  .opt { padding: 11px 14px; font-size: 15px; cursor: pointer; }
  .opt.on, .opt:hover { background: #2c3039; }
  .opt b { color: #f99e1a; font-weight: 600; }
  .label { font-size: 12px; color: #8b8f99; margin: 14px 0 6px; }
  details { margin-top: 28px; color: #8b8f99; font-size: 13px; }
  summary { cursor: pointer; }
  details .tags .tag { color: #c9ccd3; }
</style>
</head>
<body>
<div class="wrap">
  <h1>블랙리스트 조회</h1>
  <p class="sub">배틀태그 # 앞 닉네임만 입력하세요 (대소문자 무시)</p>
  <input id="q" type="text" placeholder="닉네임 입력" autocomplete="off" autofocus>
  <div id="result" class="result"></div>
  <div class="add">
    <h2>블랙리스트 추가</h2>
    <div class="row2">
      <input id="addName" type="text" placeholder="닉네임#태그 (예: 홍길동#31234)" autocomplete="off">
      <input id="addBy" type="text" placeholder="추가자" value="손건준" autocomplete="off">
    </div>
    <div class="row2 mapbox">
      <input id="addMap" type="text" placeholder="만난 맵 검색 (선택) — 초성도 됨: ㄷㄹㄷ" autocomplete="off">
      <div id="mapList" class="maplist"></div>
    </div>
    <div class="row2"><button id="addBtn" style="width:100%;height:44px">추가</button></div>
    <div id="addMsg" class="msg"></div>
  </div>
  <details>
    <summary id="count"></summary>
    <div id="all"></div>
  </details>
</div>

<script>
{
// 기존 목록 (추가일시/추가자 정보 없음)
const BASE = [
  "벛꽃#31439","자몽#32845","tom#36200","jerry#37219","뚝2스딱스#3561","캐리할게#3962",
  "hastans#3779","문어순대#3675","nyanggun85#3937","ana#34794","mushbellom#3141","깨방정하#3822",
  "개미#32577","dafran#3258","에헤이야#31540","other#31645","갓로제#3230","flex#32255",
  "IBE#21193","크왕왕악어#3936","맥크리연습용계정#3329","예린#31510","ningning#31838","최유정#31627",
  "RALOS#3416","FlameMoose#36809","KATANATHEONE#3434","carpediem#35865","조닼#3107","호두#32228",
  "JoonHee#31565","죽어서미앙#3417","공주들아모여라#3106","수다쟁이#31154","anger#11206","QIQI#31200",
  "아나키리고아냐#3779","spectra#31256","우쭈쭈받기#3544","선인장#31695","Suguru#31638","별에서온그대#31173",
  "광물줘패는계정#3743","CJAMM#31152","고애신#3793","vov#31247","JJHJ#31940","Luce#31194",
  "응애나살려줘#3859"
].map(tag => ({ tag }));

// 새로 추가된 목록 (모두에게 보임) — 형식: { tag: "닉네임#태그", map: "도라도", at: "2026-11-20 16:05", by: "손건준" }
const SHARED = [
];

// 페이지에서 직접 추가한 닉네임은 이 브라우저에만 저장됨
const KEY = "blacklist_added_v1";
function loadAdded() {
  try {
    const arr = JSON.parse(localStorage.getItem(KEY)) || [];
    return arr.map(x => typeof x === "string" ? { tag: x } : x);
  } catch (e) { return []; }
}
function saveAdded(arr) {
  try { localStorage.setItem(KEY, JSON.stringify(arr)); return true; } catch (e) { return false; }
}
let ADDED = loadAdded();
let LIST = [];

const norm = s => s.trim().toLowerCase();
const nameOf = t => t.split("#")[0];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
function nowStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const metaText = e => [e.map && `맵 ${e.map}`, e.at && `추가일시 ${e.at}`, e.by && `추가자 ${e.by}`].filter(Boolean).join(" · ");

const MAPS = ["남극 반도","부산","일리오스","리장 타워","네팔","오아시스","사모아",
  "서킷 로얄","도라도","하바나","쓰레기촌","리알토","66번 국도","샴발리 수도원","감시 기지: 지브롤터",
  "블리자드 월드","아이헨발데","할리우드","왕의 길","미드타운","눔바니","파라이수",
  "콜로세오","이스페란사","뉴 퀸 스트리트","루나사피","뉴 정크 시티","수라바사","하나오카","아누비스의 왕좌"];

// 맵 검색: 부분 일치 + 초성 검색 (예: ㄷㄹㄷ → 도라도)
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const choOf = s => [...s].map(c => {
  const k = c.charCodeAt(0) - 0xAC00;
  return (k >= 0 && k < 11172) ? CHO[Math.floor(k / 588)] : c;
}).join("");
const squash = s => s.toLowerCase().replace(/[\s:]/g, "");
const MAP_IDX = MAPS.map(m => ({ m, n: squash(m), c: squash(choOf(m)) }));
function searchMaps(q) {
  const s = squash(q);
  if (!s) return MAPS.slice();
  return MAP_IDX.filter(x => x.n.includes(s) || x.c.includes(s))
    .sort((a, b) => (b.n.startsWith(s) || b.c.startsWith(s)) - (a.n.startsWith(s) || a.c.startsWith(s)))
    .map(x => x.m);
}

const q = document.getElementById("q");
const res = document.getElementById("result");
const addName = document.getElementById("addName");
const addBy = document.getElementById("addBy");
const addMap = document.getElementById("addMap");
const mapList = document.getElementById("mapList");
let mapOpts = [], mapSel = -1;
function drawMaps() {
  mapOpts = searchMaps(addMap.value);
  if (!mapOpts.length) { mapList.className = "maplist"; return; }
  if (mapSel >= mapOpts.length) mapSel = mapOpts.length - 1;
  mapList.innerHTML = mapOpts.map((m, i) => `<div class="opt${i === mapSel ? " on" : ""}" data-map="${esc(m)}">${esc(m)}</div>`).join("");
  mapList.className = "maplist open";
  const on = mapList.querySelector(".on"); if (on) on.scrollIntoView({ block: "nearest" });
}
function closeMaps() { mapList.className = "maplist"; mapSel = -1; }
addMap.addEventListener("focus", () => { mapSel = -1; drawMaps(); });
addMap.addEventListener("input", () => { mapSel = addMap.value.trim() ? 0 : -1; drawMaps(); });
addMap.addEventListener("blur", () => setTimeout(closeMaps, 150));
mapList.addEventListener("mousedown", e => {
  const o = e.target.closest("[data-map]");
  if (o) { e.preventDefault(); addMap.value = o.dataset.map; closeMaps(); }
});
const addMsg = document.getElementById("addMsg");

try { const b = localStorage.getItem("blacklist_by"); if (b) addBy.value = b; } catch (e) {}

function check() {
  const raw = norm(q.value);
  const input = raw.split("#")[0];
  res.className = "result";
  if (!input) { res.innerHTML = ""; return; }

  const exact = LIST.filter(e => norm(nameOf(e.tag)) === input);
  if (exact.length) {
    res.className = "result hit";
    res.innerHTML = `<div class="big">🚫 블랙리스트 맞음</div>` +
      exact.map(e => `<div style="margin-top:8px"><span class="tag">${esc(e.tag)}</span>` +
        (metaText(e) ? `<div class="meta">${esc(metaText(e))}</div>` : "") + `</div>`).join("") +
      (raw.includes("#") && !exact.some(e => norm(e.tag) === raw)
        ? `<div style="margin-top:8px;font-size:13px;color:#e0a0a0">※ 닉네임은 같지만 태그 번호가 달라요</div>` : "");
    return;
  }

  const near = LIST.filter(e => norm(nameOf(e.tag)).includes(input));
  if (near.length) {
    res.className = "result near";
    res.innerHTML = `<div class="big">⚠️ 정확히 일치하는 닉네임 없음</div>비슷한 닉네임:` +
      `<div class="tags">${near.map(e => `<span class="tag" data-n="${esc(nameOf(e.tag))}">${esc(e.tag)}</span>`).join("")}</div>`;
    return;
  }

  res.className = "result miss";
  res.innerHTML = `<div class="big">✅ 블랙리스트 아님</div>`;
}

function itemHtml(e, deletable) {
  const m = metaText(e);
  return `<div class="item"><span class="n" data-n="${esc(nameOf(e.tag))}">${esc(e.tag)}</span>` +
    (m ? `<span class="m">${esc(m)}</span>` : "") +
    (deletable ? `<span class="x" data-del="${esc(e.tag)}">✕</span>` : "") + `</div>`;
}

function renderAll() {
  LIST = BASE.concat(SHARED, ADDED);
  document.getElementById("count").textContent = `전체 목록 보기 (${LIST.length}명)`;
  const newer = SHARED.concat(ADDED);
  let html = "";
  if (newer.length) {
    html += `<div class="label">새로 추가됨</div><div class="list">` +
      SHARED.map(e => itemHtml(e, false)).join("") +
      ADDED.slice().reverse().map(e => itemHtml(e, true)).join("") + `</div>`;
  }
  html += `<div class="label">기존 목록</div><div class="tags">` +
    BASE.map(e => `<span class="tag" data-n="${esc(nameOf(e.tag))}">${esc(e.tag)}</span>`).join("") + `</div>`;
  document.getElementById("all").innerHTML = html;
}

function refresh() { renderAll(); check(); }

// 삭제는 두 번 눌러야 됨 (실수 방지)
let pendingDel = null;
document.addEventListener("click", ev => {
  const d = ev.target.dataset || {};
  if (d.del) {
    if (pendingDel !== d.del) {
      pendingDel = d.del;
      addMsg.style.color = "#e0a0a0";
      addMsg.textContent = `${d.del} 삭제하려면 ✕를 한 번 더 누르세요`;
      return;
    }
    pendingDel = null;
    ADDED = ADDED.filter(e => e.tag !== d.del);
    saveAdded(ADDED);
    addMsg.textContent = "";
    refresh();
    return;
  }
  if (d.n) { q.value = d.n; check(); q.focus(); }
});

function addEntry() {
  const v = addName.value.trim().replace(/\s*#\s*/, "#");
  const by = addBy.value.trim();
  addMsg.style.color = "#e0a0a0";
  if (!/^[^#\s]+#\d{3,6}$/.test(v)) {
    addMsg.textContent = "닉네임#태그 형식으로 입력하세요 (예: 홍길동#31234)";
    return;
  }
  if (!by) { addMsg.textContent = "추가자를 입력하세요"; return; }
  if (LIST.some(e => norm(e.tag) === norm(v))) {
    addMsg.textContent = "이미 블랙리스트에 있어요";
    return;
  }
  const map = addMap.value.trim();
  const entry = { tag: v, at: nowStr(), by };
  if (map) entry.map = map;
  ADDED.push(entry);
  const ok = saveAdded(ADDED);
  try { localStorage.setItem("blacklist_by", by); } catch (e) {}
  addName.value = "";
  addMap.value = "";
  addMsg.style.color = "#7fd49a";
  addMsg.textContent = `${v} 추가됨 (${[map, entry.at, by].filter(Boolean).join(", ")})` + (ok ? "" : " — 이 브라우저에선 저장이 안 돼서 새로고침하면 사라져요");
  refresh();
}

q.addEventListener("input", check);
document.getElementById("addBtn").addEventListener("click", addEntry);
addName.addEventListener("keydown", e => { if (e.key === "Enter") addEntry(); });
addMap.addEventListener("keydown", e => {
  if (e.isComposing) return;
  const open = mapList.classList.contains("open");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!open) { drawMaps(); return; }
    mapSel = Math.max(0, Math.min(mapOpts.length - 1, mapSel + (e.key === "ArrowDown" ? 1 : -1)));
    drawMaps();
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (open && mapSel >= 0 && mapOpts[mapSel]) { addMap.value = mapOpts[mapSel]; closeMaps(); }
    else { closeMaps(); addEntry(); }
  } else if (e.key === "Escape") closeMaps();
});

renderAll();
}
</script>
</body>
</html>
